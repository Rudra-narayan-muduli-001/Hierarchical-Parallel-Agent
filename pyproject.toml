[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llm-hierarchy"
version = "0.1.0"
description = "Self-healing hierarchical multi-LLM orchestration system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
